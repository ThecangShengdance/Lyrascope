name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild \
            -project Lyrascope.xcodeproj \
            -scheme Lyrascope \
            -configuration Release \
            -derivedDataPath .build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Self test
        run: |
          APP=".build/dd/Build/Products/Release/Lyrascope.app"
          "$APP/Contents/MacOS/Lyrascope" --selftest

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Lyrascope-unsigned
          path: .build/dd/Build/Products/Release/Lyrascope.app
          if-no-files-found: error
